[pytest]
# Tests import as ``src.config_web...`` and ``tests.config_web...``, which only resolves
# with the repository root on sys.path. ``python -m pytest`` puts it there implicitly,
# and that is what CI runs — but ``pytest tests/``, which CONTRIBUTING.md and the
# developer docs tell contributors to use, does not, and failed collection on 14 files.
pythonpath = .
testpaths = tests

# The browser tests are 604 of 3665 and about nine tenths of the runtime, so the
# default run leaves them out: ``pytest`` is ~25s, the whole suite is ~8 minutes.
# A ``-m`` on the command line replaces this one (last wins), so:
#
#   pytest                 the fast lane, no Chromium needed
#   pytest -m browser      only the browser tests
#   pytest -m ""           everything
#
# CI passes ``-m`` explicitly in every job so nothing is ever skipped by default.
addopts = -m "not browser"

markers =
    browser: drives a real Chromium via Playwright; excluded from the default run
