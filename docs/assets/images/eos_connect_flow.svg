<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 538" width="620" height="538"
    role="img" aria-label="EOS Connect runs a closed loop. It reads your consumption history together with live battery charge and EV charging state, and fetches solar yield and electricity price forecasts. Both feed an optimizer that runs inside EOS Connect, which sets your battery inverter to charge, hold or discharge — directly, or through EVCC. That changes what the house is doing, which the next run reads back. An external Akkudoktor EOS or EVopt server can replace the built-in optimizer, but is not required.">
