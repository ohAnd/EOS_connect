name: Pages - publish documentation
# Publishes docs/ from two branches into one GitHub Pages site:
#
#   https://ohand.github.io/EOS_connect/           <- main    (release docs)
#   https://ohand.github.io/EOS_connect/develop/   <- develop (preview docs)
#
# The preview copy is marked in three ways, none of which exist in the repository
# and none of which therefore has to be stripped when a docs PR moves from
# develop to main:
#
#   - the banner, which docs/assets/js/site.js raises from the /develop/ URL segment
#   - a robots noindex meta, injected into the preview copy by this workflow
#   - develop/build-info.json, written by this workflow and read by the banner
#
# IMPORTANT: a Pages deployment replaces the *entire* site. A run triggered by a
# push to develop must therefore still rebuild the main copy, or it would delete
# the production documentation. Both branches are checked out on every run.

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "docs/**"
      # Only fires for a version.py pushed by hand. The [AUTO] bump cannot trigger
      # anything - see the workflow_run trigger below for why, and for what does.
      - "src/version.py"
      - ".github/workflows/pages.yml"

  # The preview banner names the build it documents, which it reads out of
  # src/version.py. That file is rewritten *after* the push that started the
  # build, by the [AUTO] commit the image workflows push with GITHUB_TOKEN - and
  # GitHub deliberately starts no workflow run from an event that token created.
  # (Verified against the run history: no repository workflow has ever run on an
  # [AUTO] commit. Which is also why docker_develop.yml, triggered by every push
  # to develop with no path filter, does not loop.)
  #
  # So a run started by the docs push reads the *previous* build number, and the
  # path filter above never rescues it. Running again once the image workflow has
  # finished is what makes the banner agree with the app.
  #
  # NOTE: a workflow_run trigger only fires for the copy of this file on the
  # default branch. It therefore stays dormant until this workflow reaches main.
  workflow_run:
    workflows: ["Main - build image and push", "Develop - build image and push"]
    types: [completed]

  workflow_dispatch: # allows manual triggering, e.g. right after switching the Pages source

permissions:
  contents: read
  pages: write
  id-token: write

# A deployment swaps the whole site, so runs must queue rather than race.
# Cancelling in flight could leave the newer commit unpublished.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PREVIEW_DIR: develop
  PREVIEW_BRANCH: develop

jobs:
  build:
    runs-on: ubuntu-latest
    # A failed image build has not bumped the version, so there is nothing new to
    # publish; every other trigger is unconditional.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout main (release docs)
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-src

      - name: Checkout develop (preview docs)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
          path: preview-src

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/"$PREVIEW_DIR"
          cp -a main-src/docs/. _site/
          cp -a preview-src/docs/. _site/"$PREVIEW_DIR"/
          # Both branches ship docs/.nojekyll already; this only guards the root
          # against a future branch that forgets it and silently gets Jekyll.
          touch _site/.nojekyll

      - name: Keep the preview out of search results
        # Injected here rather than in the pages themselves: a noindex committed to
        # docs/ would travel to main on the next merge and de-index the real site.
        # robots.txt cannot do this — a project page shares ohand.github.io, whose
        # root belongs to the user page, not to this repository.
        run: |
          set -euo pipefail
          find _site/"$PREVIEW_DIR" -name '*.html' -print0 | xargs -0 sed -i \
            's|<head>|<head>\n    <meta name="robots" content="noindex, nofollow">|'

      - name: Stamp the asset links so a deploy is not served from cache
        # The pages are static HTML and reference assets/js/site.js and
        # assets/css/style.css by bare path, so a browser holding the previous copy
        # keeps using it after a deploy. site.js owns the nav, the contents sidebar
        # and the detail-level filter, and config-reference.js renders every
        # parameter table from the schema — a stale copy of either is a visibly
        # broken page, not a cosmetic lag.
        #
        # Applied here rather than committed: the query has to change per deploy,
        # and a version written into a page would both go stale and trip
        # test_current_version_is_not_hand_written. Each copy gets the commit of the
        # branch it was built from, so the two sites version independently.
        run: |
          set -euo pipefail
          stamp() {  # stamp <html-file-list-from-stdin> <revision>
            xargs -0 sed -i \
              -e "s|\(assets/js/[a-z-]*\.js\)\"|\1?v=$1\"|g" \
              -e "s|\(assets/css/[a-z-]*\.css\)\"|\1?v=$1\"|g"
          }
          # The preview copy lives inside the root copy, so each pass names the
          # other out. Both revisions are independent: the two sites are built from
          # different branches and cache separately.
          find _site/"$PREVIEW_DIR" -name '*.html' -print0 \
            | stamp "$(git -C preview-src rev-parse --short HEAD)"
          find _site -name '*.html' -not -path "_site/$PREVIEW_DIR/*" -print0 \
            | stamp "$(git -C main-src rev-parse --short HEAD)"
          grep -ho 'assets/js/site\.js?v=[0-9a-f]*' \
            _site/index.html _site/"$PREVIEW_DIR"/index.html

      - name: Write the preview build stamp
        # The version comes from the develop checkout's src/version.py, which CI
        # rewrites on every develop build (docker_develop.yml), so the banner shows
        # the same string the running develop container reports.
        run: |
          set -euo pipefail
          version="$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" preview-src/src/version.py)"
          commit="$(git -C preview-src rev-parse --short HEAD)"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"version":"%s","commit":"%s","built":"%s"}\n' \
            "$version" "$commit" "$built" > _site/"$PREVIEW_DIR"/build-info.json
          cat _site/"$PREVIEW_DIR"/build-info.json

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
