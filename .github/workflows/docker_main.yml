name: Main - build image and push
# This workflow builds, tests, and pushes a Docker image to GitHub Container Registry.
# It is triggered on push and manual workflow_dispatch events for the "main" branch.
# The image is tagged with a release version and "latest".
# For pull requests, the Docker image is uploaded as an artifact instead of being pushed to the registry.
# The repository owner is converted to lowercase for consistent tagging.
# The workflow uses the GITHUB_TOKEN secret for authentication with GitHub Container Registry.
# The [AUTO] version commit is pushed with the deploy key in the version-bump environment
# secret VERSION_BUMP_DEPLOY_KEY: the ruleset on main/develop lets only the maintainer and
# deploy keys update those branches. That environment is restricted to main and develop, so
# a workflow on any other branch cannot read the key.
# Uncomment the Docker Hub section if you want to push to Docker Hub as well.
# The Docker Hub credentials should be stored in the repository secrets as DOCKER_USERNAME and DOCKER_PASSWORD.

# Jobs:
# - pytest: Runs unit and regression tests using pytest.
# - build_image: Builds the Docker image, tags it, and uploads it as an artifact for PRs.
# - publish_image: Downloads the image artifact and pushes it to GitHub Container Registry (on push events).

on:
  push:
    branches: ["main"]
  # pull_request:
  #   branches: [ "main" ]
  workflow_dispatch: # allows manual triggering of the workflow

env:
  VERSION_PREFIX: 0.3.

# Read-only by default; the repository default would hand every job a writable
# GITHUB_TOKEN. Jobs that publish to GHCR add packages: write for themselves. The
# [AUTO] version commit does not need contents: write - it is pushed with the
# deploy key, not with this token.
permissions:
  contents: read

jobs:
  tests:
    # This is a gate on a shared branch, so everything runs regardless of the diff.
    # The [AUTO] commit below carries [skip ci], so it starts no run at all; this guard
    # is the second line: without it, a bump that did trigger would bump again, forever.
    if: ${{ !startsWith(github.event.head_commit.message, '[AUTO]') }}
    uses: ./.github/workflows/tests.yml
    with:
      full: true

  publish_image:
    runs-on: ubuntu-24.04
    needs: tests
    environment: version-bump
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.VERSION_BUMP_DEPLOY_KEY }}

      - name: Pull latest changes
        run: git pull origin main --rebase

      - name: Set version string
        run: echo "VERSION=${{ env.VERSION_PREFIX }}${{ github.run_number }}" >> $GITHUB_ENV

      - name: Write version to file
        run: echo "__version__ = '${{ env.VERSION }}'" > src/version.py

      - name: Commit version file and push changes
        if: github.event_name == 'push'
        run: |
          git config user.name "ohAnd"
          git config user.email "ohAnd@users.noreply.github.com"
          git add src/version.py
          git commit -m "[AUTO] Update version to $VERSION" -m "[skip ci]"
          git push origin HEAD:main

      - name: Convert repository owner to lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 1. Setup QEMU for ARM64 emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # 2. Setup Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build & Push Multi-Arch Image
      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ env.owner }}/eos_connect:release
            ghcr.io/${{ env.owner }}/eos_connect:${{ env.VERSION }}
            ghcr.io/${{ env.owner }}/eos_connect:latest
          push: ${{ github.event_name == 'push' }}
